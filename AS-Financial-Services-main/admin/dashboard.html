<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard – AS Financial Services</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../at-assets/css/style.css">
<style>body{visibility:hidden}</style></head>
<body data-base="../" class="admin-body">
<header class="nav"><div class="container nav-in" style="width:96%"><a class="logo" href="dashboard.html"><span class="logo-mark">AS</span><span>AS Financial Services<small>Admin Console</small></span></a>
<div class="nav-actions"><span class="role-pill" style="margin:0">ADMIN</span><a class="btn btn-outline btn-sm" style="color:#fff;border-color:#3a4766" href="../index.html" target="_blank">View website</a><button class="btn btn-gold btn-sm" id="top-logout">Logout</button></div></div></header>
<div class="dash"><aside class="side" id="side"></aside><main class="main" id="main"></main></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="../at-assets/js/store.js"></script><script src="../at-assets/js/ui.js"></script>
<script>
if(UI.Guard.admin()){
document.body.style.visibility='visible';
const {$,$$,esc,icon,inr,fmtDate,fmtTen,fmtAmt,toast,modal,confirmBox,setErr,V}=UI;const DB=AT.DB;
const NAV=[['overview','layout','Overview'],['customers','users','Customers'],['applications','file','Applications'],['enquiries','msg','Enquiries'],['loans','briefcase','Loan Categories'],['lenders','building','Lenders'],['website','globe','Website'],['reports','chart','Reports'],['profile','settings','Admin Profile']];
let tab=(location.hash||'#overview').slice(1);if(!NAV.some(n=>n[0]===tab))tab='overview';
let charts=[];let sub='banners';const filt={cq:'',aq:'',as:'',es:''};
const loanName=id=>{const l=DB.loans().find(x=>x.id===id);return l?l.name:id};
const custName=id=>{const c=DB.customerById(id);return c?c.name:'Unknown'};
const badge=s=>'<span class="badge '+DB.STATUS_CLASS[s]+'">'+s+'</span>';
const logout=()=>{AT.Auth.logoutAdmin();toast('Logged out of admin.');setTimeout(()=>location.href='login.html',400)};
$('#top-logout').onclick=logout;
function side(){const pend=DB.enq().filter(e=>e.status==='Pending').length;
 $('#side').innerHTML='<h5>Management</h5>'+NAV.map(n=>'<button data-t="'+n[0]+'" class="'+(n[0]===tab?'on':'')+'">'+icon(n[1])+' '+n[2]+(n[0]==='enquiries'&&pend?'<span class="cnt">'+pend+'</span>':'')+'</button>').join('')+'<h5>Session</h5><button id="sl">'+icon('logout')+' Logout</button>';
 $$('[data-t]',$('#side')).forEach(b=>b.onclick=()=>go(b.dataset.t));$('#sl').onclick=logout;}
function go(t){tab=t;history.replaceState(null,'','#'+t);render()}
const head=(t,s,act)=>'<div class="main-head"><div><h1>'+t+'</h1><p>'+s+'</p></div><div>'+(act||'')+'</div></div>';
const note='<div class="demo-note" style="margin-bottom:20px">Demo admin — changes apply to the shared simulated data in this browser.</div>';
const stat=(n,l,ic,bg,fg)=>'<div class="card stat"><div class="ic" style="background:'+bg+';color:'+fg+'">'+icon(ic)+'</div><div><b>'+n+'</b><span>'+l+'</span></div></div>';

/* generic form modal */
function form(title,fields,vals,onSave){vals=vals||{};
 const f=fields.map(x=>{const v=vals[x.n]!=null?vals[x.n]:(x.def!=null?x.def:'');let el;
  if(x.t==='textarea')el='<textarea class="input" name="'+x.n+'" rows="3">'+esc(v)+'</textarea>';
  else if(x.t==='select')el='<select class="input" name="'+x.n+'">'+x.o.map(o=>'<option value="'+esc(o[0])+'"'+(String(o[0])===String(v)?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>';
  else if(x.t==='checks')el='<div style="display:flex;flex-wrap:wrap;gap:10px">'+x.o.map(o=>'<label class="check"><input type="checkbox" name="'+x.n+'" value="'+esc(o[0])+'"'+((v||[]).includes(o[0])?' checked':'')+'> '+esc(o[1])+'</label>').join('')+'</div>';
  else el='<input class="input" name="'+x.n+'" type="'+(x.t||'text')+'" value="'+esc(v)+'" '+(x.attr||'')+'>';
  return '<div class="'+(x.full?'full':'')+'"><label class="lbl">'+x.l+'</label>'+el+'</div>'}).join('');
 const m=modal('<form class="form-grid" novalidate>'+f+'<div class="full" style="display:flex;gap:10px;justify-content:flex-end"><button type="button" class="btn btn-outline" data-close>Cancel</button><button class="btn btn-gold" type="submit">Save</button></div></form>',{title,wide:true});
 $('form',m).onsubmit=e=>{e.preventDefault();const fm=e.target;let ok=true;const out={};
  fields.forEach(x=>{if(x.t==='checks'){out[x.n]=$$('[name='+x.n+']:checked',fm).map(i=>i.value);return}
   const el=fm.elements[x.n];let v=el.value.trim();if(x.t==='number')v=v===''?'':+v;
   if(x.req&&(v===''||(x.t==='number'&&isNaN(v))))ok=setErr(el,'This field is required.')&&false;
   else if(x.min!=null&&v<x.min)ok=setErr(el,'Must be at least '+x.min+'.')&&false;else if(el.classList)setErr(el,'');out[x.n]=v});
  if(!ok)return;onSave(out);m.close();};return m}

const R={
overview(){const a=DB.apps(),c=AT.Auth.customers(),e=DB.enq();
 return head('Dashboard Overview','Welcome back, '+esc(AT.Auth.admin().name)+'.')+note+
 '<div class="grid g3" style="margin-bottom:24px">'+stat(c.length,'Registered customers','users','#E4EEFF','#1f4fb0')+stat(a.length,'Total applications','file','#FFF1D6','#9a6200')+stat(a.filter(x=>['Application Submitted','Under Review','Documents Required'].includes(x.status)).length,'Pending applications','clock','#FDE7D3','#b0520a')+stat(a.filter(x=>x.status==='Approved').length,'Approved','check','#D9F4E6','#146c43')+stat(a.filter(x=>x.status==='Rejected').length,'Rejected','x','#FBDADA','#a12929')+stat(e.length+' <small style="font:500 .8rem var(--sans);color:var(--muted)">('+e.filter(x=>x.status==='Pending').length+' pending)</small>','Total enquiries','msg','#EFE6FF','#5b3bb0')+'</div>'+
 '<div class="grid" style="grid-template-columns:1fr 1.4fr;gap:24px" id="og"><div class="card chart-card"><h3 style="margin-bottom:14px">Application status</h3><canvas id="c1"></canvas></div><div class="card"><div class="row-between" style="margin-bottom:12px"><h3>Latest applications</h3><button class="btn btn-ghost btn-sm" data-t="applications">View all</button></div><div class="table-wrap" style="box-shadow:none;border:0"><table class="tbl" style="min-width:480px"><tr><th>Ref</th><th>Customer</th><th>Status</th></tr>'+a.slice(0,6).map(x=>'<tr><td>'+esc(x.ref)+'</td><td>'+esc(custName(x.customerId))+'</td><td>'+badge(x.status)+'</td></tr>').join('')+'</table></div></div></div>'},
customers(){const q=filt.cq.toLowerCase();const l=AT.Auth.customers().filter(c=>!q||(c.name+c.email+c.mobile).toLowerCase().includes(q));const apps=DB.apps();
 return head('Customer Management','View registered customers and their application history.')+note+'<div class="toolbar"><input class="input" id="cq" placeholder="Search name, email or mobile…" value="'+esc(filt.cq)+'" style="min-width:280px"><span style="margin-left:auto;color:var(--muted);font-size:.88rem">'+l.length+' customers</span></div><div class="table-wrap"><table class="tbl"><tr><th>Customer</th><th>Email</th><th>Mobile</th><th>Joined</th><th>Applications</th><th></th></tr>'+(l.length?l.map(c=>'<tr><td><div style="display:flex;gap:10px;align-items:center"><div class="avatar">'+UI.initials(c.name)+'</div><b style="color:var(--navy)">'+esc(c.name)+'</b></div></td><td>'+esc(c.email)+'</td><td>'+esc(c.mobile)+'</td><td>'+fmtDate(c.created)+'</td><td>'+apps.filter(a=>a.customerId===c.id).length+'</td><td><button class="btn btn-outline btn-sm" data-cv="'+c.id+'">View Profile</button></td></tr>').join(''):'<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:30px">No customers found.</td></tr>')+'</table></div>'},
applications(){const q=filt.aq.toLowerCase();const l=DB.apps().filter(a=>(!filt.as||a.status===filt.as)&&(!q||(a.ref+custName(a.customerId)+loanName(a.type)).toLowerCase().includes(q)));
 return head('Loan Applications','Review submissions, change status and request documents.')+note+'<div class="toolbar"><input class="input" id="aq" placeholder="Search ref, customer, loan type…" value="'+esc(filt.aq)+'" style="min-width:260px"><select class="input" id="as"><option value="">All statuses</option>'+DB.STATUS.map(s=>'<option'+(filt.as===s?' selected':'')+'>'+s+'</option>').join('')+'</select><span style="margin-left:auto;color:var(--muted);font-size:.88rem">'+l.length+' applications</span></div><div class="table-wrap"><table class="tbl"><tr><th>Reference</th><th>Customer</th><th>Loan</th><th>Amount</th><th>Applied</th><th>Status</th><th></th></tr>'+(l.length?l.map(a=>'<tr><td><b>'+esc(a.ref)+'</b></td><td>'+esc(custName(a.customerId))+'</td><td>'+esc(loanName(a.type))+'</td><td>'+inr(a.amount)+'</td><td>'+fmtDate(a.created)+'</td><td>'+badge(a.status)+'</td><td><button class="btn btn-outline btn-sm" data-av="'+a.id+'">View / Manage</button></td></tr>').join(''):'<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:30px">No applications found.</td></tr>')+'</table></div>'},
enquiries(){const l=DB.enq().filter(e=>!filt.es||e.status===filt.es);
 return head('Enquiry Management','Contact form submissions and customer messages.')+note+'<div class="toolbar"><select class="input" id="es"><option value="">All enquiries</option><option'+(filt.es==='Pending'?' selected':'')+'>Pending</option><option'+(filt.es==='Resolved'?' selected':'')+'>Resolved</option></select><span style="margin-left:auto;color:var(--muted);font-size:.88rem">'+l.length+' shown</span></div><div class="table-wrap"><table class="tbl"><tr><th>Date</th><th>From</th><th>Message</th><th>Status</th><th></th></tr>'+(l.length?l.map(e=>'<tr><td style="white-space:nowrap">'+fmtDate(e.date)+'</td><td><b style="color:var(--navy)">'+esc(e.name)+'</b><div style="font-size:.8rem;color:var(--muted)">'+esc(e.email)+' • '+esc(e.phone||'')+'</div></td><td style="max-width:340px">'+esc(e.message)+'</td><td><span class="badge '+(e.status==='Resolved'?'b-res':'b-pend')+'">'+e.status+'</span></td><td style="white-space:nowrap"><button class="btn btn-outline btn-sm" data-et="'+e.id+'">Mark '+(e.status==='Resolved'?'Pending':'Resolved')+'</button> <button class="icon-btn" style="display:inline-grid;vertical-align:middle" data-ed="'+e.id+'" aria-label="Delete">'+icon('trash')+'</button></td></tr>').join(''):'<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:30px">No enquiries.</td></tr>')+'</table></div>'},
loans(){const l=DB.loans();
 return head('Loan Categories','Add, edit or delete loan categories and sample rates / eligibility.','<button class="btn btn-gold" id="add-loan">'+icon('plus')+' Add Category</button>')+note+'<div class="table-wrap"><table class="tbl"><tr><th>Category</th><th>Sample rate</th><th>Amount range</th><th>Tenure</th><th>Eligibility</th><th></th></tr>'+(l.length?l.map(x=>'<tr><td><b style="color:var(--navy)">'+esc(x.name)+'</b></td><td>'+esc(x.rate)+'</td><td>₹'+fmtAmt(x.minAmt)+' – ₹'+fmtAmt(x.maxAmt)+'</td><td>'+esc(x.tenure)+'</td><td style="max-width:260px;font-size:.85rem">'+esc(x.eligibility)+'</td><td style="white-space:nowrap"><button class="btn btn-outline btn-sm" data-le="'+x.id+'">Edit</button> <button class="icon-btn" style="display:inline-grid;vertical-align:middle" data-ld="'+x.id+'" aria-label="Delete">'+icon('trash')+'</button></td></tr>').join(''):'<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--muted)">No categories.</td></tr>')+'</table></div>'},
lenders(){const l=DB.lenders();
 return head('Lender Management','Manage lender listings and sample interest rates.','<button class="btn btn-gold" id="add-lender">'+icon('plus')+' Add Lender</button>')+note+'<div class="table-wrap"><table class="tbl"><tr><th>Lender</th><th>Rate</th><th>Amount</th><th>Fee</th><th>Loan types</th><th>Listing</th><th></th></tr>'+(l.length?l.map(x=>'<tr><td><b style="color:var(--navy)">'+esc(x.name)+'</b></td><td>'+x.rate+'% – '+x.rateMax+'%</td><td>₹'+fmtAmt(x.minAmt)+' – ₹'+fmtAmt(x.maxAmt)+'</td><td>'+x.fee+'%</td><td style="font-size:.82rem;max-width:200px">'+x.types.map(loanName).map(esc).join(', ')+'</td><td><span class="badge '+(x.enabled?'b-res':'b-off')+'">'+(x.enabled?'Enabled':'Disabled')+'</span></td><td style="white-space:nowrap"><button class="btn btn-outline btn-sm" data-lt="'+x.id+'">'+(x.enabled?'Disable':'Enable')+'</button> <button class="btn btn-outline btn-sm" data-lne="'+x.id+'">Edit</button> <button class="icon-btn" style="display:inline-grid;vertical-align:middle" data-lnd="'+x.id+'" aria-label="Delete">'+icon('trash')+'</button></td></tr>').join(''):'<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--muted)">No lenders.</td></tr>')+'</table></div>'},
website(){const s=DB.site();const tabs=[['banners','Homepage banners'],['services','Service descriptions'],['testimonials','Testimonials'],['faqs','FAQs']];
 let body='';
 if(sub==='banners')body='<div class="row-between" style="margin-bottom:14px"><p style="color:var(--muted)">Rotating announcement bar on the homepage.</p><button class="btn btn-gold btn-sm" data-add="banners">'+icon('plus')+' Add Banner</button></div>'+tbl(['Banner text'],s.banners.map(b=>[esc(b.title)]),s.banners,'banners');
 if(sub==='services')body='<p style="color:var(--muted);margin-bottom:14px">Edit the short description shown on service cards and detail pages.</p>'+'<div class="table-wrap"><table class="tbl"><tr><th>Service</th><th>Description</th><th></th></tr>'+DB.loans().map(l=>'<tr><td><b>'+esc(l.name)+'</b></td><td style="max-width:460px">'+esc(l.desc)+'</td><td><button class="btn btn-outline btn-sm" data-sd="'+l.id+'">Edit</button></td></tr>').join('')+'</table></div>';
 if(sub==='testimonials')body='<div class="row-between" style="margin-bottom:14px"><p style="color:var(--muted)">Shown in the homepage reviews section.</p><button class="btn btn-gold btn-sm" data-add="testimonials">'+icon('plus')+' Add Testimonial</button></div>'+tbl(['Name','Rating','Testimonial'],s.testimonials.map(t=>['<b>'+esc(t.name)+'</b><div style="font-size:.8rem;color:var(--muted)">'+esc(t.role)+'</div>','<span class="stars">'+'★'.repeat(t.rating)+'</span>',esc(t.text)]),s.testimonials,'testimonials');
 if(sub==='faqs')body='<div class="row-between" style="margin-bottom:14px"><p style="color:var(--muted)">Questions shown in the homepage FAQ accordion.</p><button class="btn btn-gold btn-sm" data-add="faqs">'+icon('plus')+' Add FAQ</button></div>'+tbl(['Question','Answer'],s.faqs.map(f=>['<b>'+esc(f.q)+'</b>',esc(f.a)]),s.faqs,'faqs');
 return head('Website Management','Control public website content.')+note+'<div class="tabs" style="max-width:620px">'+tabs.map(t=>'<button data-sub="'+t[0]+'" class="'+(sub===t[0]?'on':'')+'">'+t[1]+'</button>').join('')+'</div>'+body},
reports(){const a=DB.apps(),c=AT.Auth.customers();
 return head('Reports & Analytics','Application and customer statistics.')+note+'<div class="grid g4" style="margin-bottom:24px">'+stat(a.length,'Applications','file','#FFF1D6','#9a6200')+stat(inr(a.reduce((s,x)=>s+(+x.amount||0),0)),'Total amount requested','wallet','#E4EEFF','#1f4fb0')+stat(a.length?Math.round(a.filter(x=>x.status==='Approved').length/a.length*100)+'%':'0%','Approval rate','check','#D9F4E6','#146c43')+stat(c.length,'Customers','users','#EFE6FF','#5b3bb0')+'</div><div class="grid g2"><div class="card chart-card"><h3 style="margin-bottom:12px">Application status</h3><canvas id="r1"></canvas></div><div class="card chart-card"><h3 style="margin-bottom:12px">Applications by loan category</h3><canvas id="r2"></canvas></div><div class="card chart-card"><h3 style="margin-bottom:12px">Customer registrations (last 6 months)</h3><canvas id="r3"></canvas></div><div class="card chart-card"><h3 style="margin-bottom:12px">Applications submitted (last 6 months)</h3><canvas id="r4"></canvas></div></div>'},
profile(){const ad=AT.Auth.admin();
 return head('Admin Profile','Your administrator account.')+note+'<div class="grid g2"><div class="card"><div style="display:flex;gap:16px;align-items:center;margin-bottom:18px"><div class="avatar" style="width:64px;height:64px;font-size:1.3rem;background:var(--gold);color:var(--navy)">AU</div><div><h3>'+esc(ad.name)+'</h3><span class="role-pill" style="margin:0">ADMIN</span></div></div><dl class="kv"><dt>Email</dt><dd>'+esc(ad.email)+'</dd><dt>Role</dt><dd>ADMIN</dd><dt>Session</dt><dd>Active (cleared on logout / browser close)</dd></dl><button class="btn btn-danger" style="margin-top:20px" id="pl">'+icon('logout')+' Logout</button></div>'+
 '<div class="card"><h3 style="margin-bottom:14px">Change password (simulated)</h3><form id="pw" novalidate><div style="margin-bottom:14px"><label class="lbl">Current password</label><div class="pw"><input class="input" name="cur" type="password"><button type="button"></button></div></div><div style="margin-bottom:14px"><label class="lbl">New password</label><div class="pw"><input class="input" name="np" type="password"><button type="button"></button></div></div><div style="margin-bottom:18px"><label class="lbl">Confirm new password</label><div class="pw"><input class="input" name="cp" type="password"><button type="button"></button></div></div><button class="btn btn-navy" type="submit">Update Password</button></form></div></div>'+
 '<div class="card" style="margin-top:24px"><h3>Reset demo data</h3><p style="color:var(--muted);margin:8px 0 14px;font-size:.92rem">Restore all sample customers, applications, lenders and content to their original state. This also signs you out.</p><button class="btn btn-outline" id="reset">Reset Demo Data</button></div>'}
};
function tbl(cols,rows,src,key){return '<div class="table-wrap"><table class="tbl"><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'<th></th></tr>'+(rows.length?rows.map((r,i)=>'<tr>'+r.map(c=>'<td style="max-width:420px">'+c+'</td>').join('')+'<td style="white-space:nowrap"><button class="btn btn-outline btn-sm" data-edit="'+key+':'+src[i].id+'">Edit</button> <button class="icon-btn" style="display:inline-grid;vertical-align:middle" data-del="'+key+':'+src[i].id+'" aria-label="Delete">'+icon('trash')+'</button></td></tr>').join(''):'<tr><td colspan="'+(cols.length+1)+'" style="text-align:center;color:var(--muted);padding:26px">Nothing here yet.</td></tr>')+'</table></div>'}
const SITEF={banners:[[{n:'title',l:'Banner text',req:1,full:1}],'Banner'],testimonials:[[{n:'name',l:'Name',req:1},{n:'role',l:'Role / location',req:1},{n:'rating',l:'Rating (1–5)',t:'number',req:1,min:1,attr:'max="5"',def:5},{n:'text',l:'Testimonial',t:'textarea',req:1,full:1}],'Testimonial'],faqs:[[{n:'q',l:'Question',req:1,full:1},{n:'a',l:'Answer',t:'textarea',req:1,full:1}],'FAQ']};
const LOANF=[{n:'name',l:'Category name',req:1,full:1},{n:'rate',l:'Sample interest rate (text)',req:1,def:'10% – 20%'},{n:'tenure',l:'Tenure (text)',req:1,def:'12 – 60 months'},{n:'minAmt',l:'Minimum amount (₹)',t:'number',req:1,min:0},{n:'maxAmt',l:'Maximum amount (₹)',t:'number',req:1,min:1},{n:'eligibility',l:'Eligibility criteria',t:'textarea',req:1,full:1},{n:'desc',l:'Description',t:'textarea',req:1,full:1}];
const lenderF=()=>[{n:'name',l:'Lender name',req:1,full:1},{n:'rate',l:'Rate from (% p.a.)',t:'number',req:1,min:0,attr:'step="0.1"'},{n:'rateMax',l:'Rate up to (% p.a.)',t:'number',req:1,min:0,attr:'step="0.1"'},{n:'minAmt',l:'Minimum amount (₹)',t:'number',req:1,min:0},{n:'maxAmt',l:'Maximum amount (₹)',t:'number',req:1,min:1},{n:'minTen',l:'Min tenure (months)',t:'number',req:1,min:1},{n:'maxTen',l:'Max tenure (months)',t:'number',req:1,min:1},{n:'fee',l:'Processing fee (%)',t:'number',req:1,min:0,attr:'step="0.05"'},{n:'elig',l:'Eligibility summary',req:1},{n:'types',l:'Loan types offered',t:'checks',o:DB.loans().map(l=>[l.id,l.name]),full:1}];

function appModal(id){const a=DB.apps().find(x=>x.id===id);if(!a)return;const c=DB.customerById(a.customerId)||{};const p=a.personal||{},m=a.employment||{};
 const mm=modal('<div class="grid g2" style="gap:14px;margin-bottom:16px"><div class="review-sec" style="margin:0"><h3 style="font-size:1rem;margin-bottom:8px">Applicant</h3><dl class="kv" style="grid-template-columns:100px 1fr"><dt>Name</dt><dd>'+esc(p.name||c.name)+'</dd><dt>DOB</dt><dd>'+esc(p.dob||'—')+'</dd><dt>Mobile</dt><dd>'+esc(p.mobile||c.mobile)+'</dd><dt>Email</dt><dd>'+esc(p.email||c.email)+'</dd><dt>Address</dt><dd>'+esc(p.address||'—')+'</dd></dl></div><div class="review-sec" style="margin:0"><h3 style="font-size:1rem;margin-bottom:8px">Employment</h3><dl class="kv" style="grid-template-columns:100px 1fr"><dt>Type</dt><dd>'+esc(m.type||'—')+'</dd><dt>Company</dt><dd>'+esc(m.company||'—')+'</dd><dt>Income</dt><dd>'+(m.income?inr(m.income):'—')+'</dd><dt>Experience</dt><dd>'+(m.experience!=null?m.experience+' yrs':'—')+'</dd></dl></div></div>'+
 '<div class="review-sec"><h3 style="font-size:1rem;margin-bottom:8px">Loan &amp; documents</h3><dl class="kv"><dt>Loan type</dt><dd>'+esc(loanName(a.type))+'</dd><dt>Amount</dt><dd>'+inr(a.amount)+'</dd><dt>Tenure</dt><dd>'+fmtTen(a.tenure)+'</dd><dt>Purpose</dt><dd>'+esc(a.purpose||'—')+'</dd><dt>Identity proof</dt><dd>'+esc((a.docs||{}).identity||'Not uploaded')+'</dd><dt>Address proof</dt><dd>'+esc((a.docs||{}).address||'Not uploaded')+'</dd><dt>Income proof</dt><dd>'+esc((a.docs||{}).income||'Not uploaded')+'</dd></dl></div>'+
 '<div class="review-sec"><div class="row-between"><h3 style="font-size:1rem">Manage status</h3>'+badge(a.status)+'</div><div class="form-grid" style="margin-top:12px"><div><label class="lbl">Set status</label><select class="input" id="ns">'+DB.STATUS.map(s=>'<option'+(s===a.status?' selected':'')+'>'+s+'</option>').join('')+'</select></div><div class="full"><label class="lbl">Note to customer / documents requested</label><textarea class="input" id="nn" rows="2" placeholder="e.g. Please upload last 3 months salary slips"></textarea><div class="err-msg" id="nn-e"></div></div></div>'+
 '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn btn-navy btn-sm" id="u-save">Update Status</button><button class="btn btn-sm" style="background:var(--ok);color:#fff" id="u-ok">Approve</button><button class="btn btn-danger btn-sm" id="u-no">Reject</button><button class="btn btn-outline btn-sm" id="u-doc">Request Documents</button></div></div>'+
 '<div class="review-sec"><h3 style="font-size:1rem;margin-bottom:10px">History</h3><ul class="timeline">'+a.history.slice().reverse().map(h=>'<li><b>'+esc(h.status)+'</b> <span style="color:var(--muted)">· '+fmtDate(h.date)+'</span><div style="font-size:.84rem;color:var(--muted)">'+esc(h.note||'')+'</div></li>').join('')+'</ul></div>',{title:esc(a.ref)+' — '+esc(loanName(a.type)),wide:true});
 const apply=(s,n)=>{DB.setStatus(id,s,n);toast('Status updated to "'+s+'". The customer has been notified.','ok');mm.close();render()};
 $('#u-save',mm).onclick=()=>{const s=$('#ns',mm).value;const n=$('#nn',mm).value.trim();if(s==='Documents Required'&&!n){$('#nn-e',mm).textContent='Describe which documents are required.';return}apply(s,n||undefined)};
 $('#u-ok',mm).onclick=()=>apply('Approved',$('#nn',mm).value.trim()||'Application approved (demo)');
 $('#u-no',mm).onclick=()=>apply('Rejected',$('#nn',mm).value.trim()||'Application rejected (demo)');
 $('#u-doc',mm).onclick=()=>{const n=$('#nn',mm).value.trim();if(!n){$('#nn-e',mm).textContent='Describe which documents are required.';return}apply('Documents Required',n)};}
function custModal(id){const c=DB.customerById(id);if(!c)return;const apps=DB.apps().filter(a=>a.customerId===id);
 modal('<dl class="kv" style="margin-bottom:18px"><dt>Name</dt><dd>'+esc(c.name)+'</dd><dt>Email</dt><dd>'+esc(c.email)+'</dd><dt>Mobile</dt><dd>'+esc(c.mobile)+'</dd><dt>City</dt><dd>'+esc(c.city||'—')+'</dd><dt>Role</dt><dd>'+esc(c.role)+'</dd><dt>Joined</dt><dd>'+fmtDate(c.created)+'</dd><dt>Saved lenders</dt><dd>'+c.saved.length+'</dd></dl><h3 style="font-size:1.1rem;margin-bottom:10px">Application history</h3>'+(apps.length?'<div class="table-wrap" style="box-shadow:none"><table class="tbl" style="min-width:0"><tr><th>Ref</th><th>Loan</th><th>Amount</th><th>Status</th></tr>'+apps.map(a=>'<tr><td>'+esc(a.ref)+'</td><td>'+esc(loanName(a.type))+'</td><td>'+inr(a.amount)+'</td><td>'+badge(a.status)+'</td></tr>').join('')+'</table></div>':'<p style="color:var(--muted)">No applications yet.</p>'),{title:esc(c.name),wide:true});}

function wire(){const M=$('#main');
 $$('[data-t]',M).forEach(b=>b.onclick=()=>go(b.dataset.t));
 $$('[data-cv]',M).forEach(b=>b.onclick=()=>custModal(b.dataset.cv));
 $$('[data-av]',M).forEach(b=>b.onclick=()=>appModal(b.dataset.av));
 const bind=(id,k)=>{const el=$('#'+id);if(el)el.oninput=()=>{filt[k]=el.value;const pos=el.selectionStart;render();const n=$('#'+id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}};bind('cq','cq');bind('aq','aq');bind('as','as');bind('es','es');
 $$('[data-et]',M).forEach(b=>b.onclick=()=>{const l=DB.enq();const e=l.find(x=>x.id===b.dataset.et);e.status=e.status==='Resolved'?'Pending':'Resolved';DB.saveEnq(l);toast('Enquiry marked '+e.status.toLowerCase()+'.','ok');render()});
 $$('[data-ed]',M).forEach(b=>b.onclick=()=>confirmBox('Delete this enquiry permanently?',()=>{DB.saveEnq(DB.enq().filter(x=>x.id!==b.dataset.ed));render()}));
 const al=$('#add-loan');if(al)al.onclick=()=>form('Add loan category',LOANF,{},v=>{const l=DB.loans();let id=v.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||DB.uid('loan');if(l.some(x=>x.id===id))id+='-'+Math.floor(Math.random()*99);l.push(Object.assign({id,icon:'wallet',grad:'linear-gradient(135deg,#0B1F3A,#1d4a85)',docs:['Identity proof','Address proof','Income proof']},v));DB.saveLoans(l);toast('Category added.','ok');render()});
 $$('[data-le]',M).forEach(b=>b.onclick=()=>form('Edit loan category',LOANF,DB.loans().find(x=>x.id===b.dataset.le),v=>{DB.saveLoans(DB.loans().map(x=>x.id===b.dataset.le?Object.assign({},x,v):x));toast('Category updated.','ok');render()}));
 $$('[data-ld]',M).forEach(b=>b.onclick=()=>confirmBox('Delete this loan category? Existing applications keep their records.',()=>{DB.saveLoans(DB.loans().filter(x=>x.id!==b.dataset.ld));toast('Category deleted.');render()}));
 const alr=$('#add-lender');if(alr)alr.onclick=()=>form('Add lender',lenderF(),{minTen:12,maxTen:60,fee:1},v=>{const l=DB.lenders();l.push(Object.assign({id:DB.uid('l'),enabled:true,color:'#12305A'},v));DB.saveLenders(l);toast('Lender added.','ok');render()});
 $$('[data-lne]',M).forEach(b=>b.onclick=()=>form('Edit lender',lenderF(),DB.lenders().find(x=>x.id===b.dataset.lne),v=>{DB.saveLenders(DB.lenders().map(x=>x.id===b.dataset.lne?Object.assign({},x,v):x));toast('Lender updated.','ok');render()}));
 $$('[data-lt]',M).forEach(b=>b.onclick=()=>{DB.saveLenders(DB.lenders().map(x=>x.id===b.dataset.lt?Object.assign({},x,{enabled:!x.enabled}):x));toast('Lender listing updated.','ok');render()});
 $$('[data-lnd]',M).forEach(b=>b.onclick=()=>confirmBox('Delete this lender listing?',()=>{DB.saveLenders(DB.lenders().filter(x=>x.id!==b.dataset.lnd));render()}));
 $$('[data-sub]',M).forEach(b=>b.onclick=()=>{sub=b.dataset.sub;render()});
 $$('[data-sd]',M).forEach(b=>b.onclick=()=>form('Edit service description',[{n:'desc',l:'Description',t:'textarea',req:1,full:1}],DB.loans().find(x=>x.id===b.dataset.sd),v=>{DB.saveLoans(DB.loans().map(x=>x.id===b.dataset.sd?Object.assign({},x,v):x));toast('Description updated.','ok');render()}));
 $$('[data-add]',M).forEach(b=>{const k=b.dataset.add;b.onclick=()=>form('Add '+SITEF[k][1],SITEF[k][0],{},v=>{const s=DB.site();s[k].push(Object.assign({id:DB.uid(k[0])},v));DB.saveSite(s);toast(SITEF[k][1]+' added.','ok');render()})});
 $$('[data-edit]',M).forEach(b=>{const [k,id]=b.dataset.edit.split(':');b.onclick=()=>form('Edit '+SITEF[k][1],SITEF[k][0],DB.site()[k].find(x=>x.id===id),v=>{const s=DB.site();s[k]=s[k].map(x=>x.id===id?Object.assign({},x,v):x);DB.saveSite(s);toast('Saved.','ok');render()})});
 $$('[data-del]',M).forEach(b=>{const [k,id]=b.dataset.del.split(':');b.onclick=()=>confirmBox('Delete this item?',()=>{const s=DB.site();s[k]=s[k].filter(x=>x.id!==id);DB.saveSite(s);render()})});
 const pw=$('#pw');if(pw){UI.pwToggle(M);pw.onsubmit=e=>{e.preventDefault();let ok=true;ok=setErr(pw.cur,!pw.cur.value?'Enter your current password.':'')&&ok;ok=setErr(pw.np,!V.pass(pw.np.value)?'Use 8+ characters with uppercase, lowercase and a number.':'')&&ok;ok=setErr(pw.cp,pw.cp.value!==pw.np.value?'Passwords do not match.':'')&&ok;if(!ok)return;const r=AT.Auth.changeAdminPassword(pw.cur.value,pw.np.value);if(!r.ok){setErr(pw.cur,r.msg);return}pw.reset();toast('Admin password updated (simulated).','ok')}}
 const pl=$('#pl');if(pl)pl.onclick=logout;
 const rs=$('#reset');if(rs)rs.onclick=()=>confirmBox('Reset all demo data to defaults?',()=>{DB.resetDemo();location.href='login.html'});
 charts.forEach(c=>c.destroy());charts=[];drawCharts();
 const og=$('#og');if(og&&innerWidth<900)og.style.gridTemplateColumns='1fr';
}
function drawCharts(){if(!window.Chart)return;const a=DB.apps(),c=AT.Auth.customers();
 const COL=['#4C7DD8','#E3A21A','#E8782E','#1F9D63','#D64545'];const mk=(id,cfg)=>{const el=$('#'+id);if(el)charts.push(new Chart(el,cfg))};
 const status=DB.STATUS.map(s=>a.filter(x=>x.status===s).length);
 const dn=(id)=>mk(id,{type:'doughnut',data:{labels:DB.STATUS,datasets:[{data:status,backgroundColor:COL,borderWidth:0}]},options:{cutout:'62%',plugins:{legend:{position:'bottom'}}}});
 dn('c1');dn('r1');
 const loans=DB.loans();mk('r2',{type:'bar',data:{labels:loans.map(l=>l.name.replace(' Loans','').replace(' Loan','')),datasets:[{label:'Applications',data:loans.map(l=>a.filter(x=>x.type===l.id).length),backgroundColor:'#C9A227',borderRadius:6}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});
 const months=[...Array(6)].map((_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-(5-i));return d});const key=d=>d.getFullYear()+'-'+d.getMonth();const lab=d=>d.toLocaleString('en-IN',{month:'short'});
 const cnt=(list)=>months.map(m=>list.filter(x=>key(new Date(x.created))===key(m)).length);
 mk('r3',{type:'bar',data:{labels:months.map(lab),datasets:[{label:'New customers',data:cnt(c),backgroundColor:'#12305A',borderRadius:6}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});
 mk('r4',{type:'line',data:{labels:months.map(lab),datasets:[{label:'Applications',data:cnt(a),borderColor:'#C9A227',backgroundColor:'rgba(201,162,39,.15)',fill:true,tension:.35}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});}
function render(){if(!AT.Auth.admin()){location.replace('login.html');return}side();$('#main').innerHTML=R[tab]();wire();}
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(NAV.some(n=>n[0]===t)&&t!==tab){tab=t;render()}});
render();
}
</script></body></html>
