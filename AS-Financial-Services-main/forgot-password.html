<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password – AS Financial Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="at-assets/css/style.css"></head>
<body data-base="">
<div id="site-header"></div>
<main class="auth">
  <div class="auth-art"><h2>Reset your password</h2><p>Verify with a simulated OTP, then choose a new password for your customer account.</p></div>
  <div class="auth-form"><div class="auth-card">
    <h1>Forgot Password</h1><p id="sub">Enter your registered email or mobile number.</p>
    <form id="s1" novalidate><div style="margin-bottom:20px"><label class="lbl">Email or mobile number</label><input class="input" name="idf" placeholder="you@example.com or 9876543210"></div><button class="btn btn-gold btn-block" type="submit">Send OTP (demo)</button></form>
    <form id="s2" class="hidden" novalidate><div class="demo-note" style="margin-bottom:14px">Demo OTP: <b>123456</b></div><div style="margin-bottom:20px"><label class="lbl">Enter OTP</label><input class="input" name="otp" maxlength="6" inputmode="numeric" placeholder="6-digit code"></div><button class="btn btn-gold btn-block" type="submit">Verify OTP</button></form>
    <form id="s3" class="hidden" novalidate>
      <div style="margin-bottom:14px"><label class="lbl">New password</label><div class="pw"><input class="input" name="np" type="password" placeholder="Min 8 chars, upper, lower, number"><button type="button" aria-label="Show password"></button></div></div>
      <div style="margin-bottom:20px"><label class="lbl">Confirm new password</label><div class="pw"><input class="input" name="cp" type="password" placeholder="Re-enter password"><button type="button" aria-label="Show password"></button></div></div>
      <button class="btn btn-gold btn-block" type="submit">Reset Password</button></form>
    <p style="text-align:center;margin-top:24px"><a class="link" href="login.html">Back to login</a></p>
  </div></div>
</main>
<div id="site-footer"></div>
<script src="at-assets/js/store.js"></script><script src="at-assets/js/ui.js"></script>
<script>
UI.mount('');const {$,setErr,V}=UI;let cust;
$('#s1').addEventListener('submit',e=>{e.preventDefault();const f=e.target,v=f.idf.value.trim();
 if(!setErr(f.idf,!v?'Enter your email or mobile number.':(!V.email(v)&&!V.mobile(v)?'Enter a valid email or 10-digit mobile.':'')))return;
 cust=AT.Auth.findCustomer(v);if(!cust){setErr(f.idf,'No account found with these details.');return}
 $('#s1').classList.add('hidden');$('#s2').classList.remove('hidden');$('#sub').textContent='We sent a code to your registered mobile (simulated).';UI.toast('Demo OTP: 123456')});
$('#s2').addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(!setErr(f.otp,f.otp.value.trim()!=='123456'?'Incorrect OTP. Use 123456 for this demo.':''))return;
 $('#s2').classList.add('hidden');$('#s3').classList.remove('hidden');$('#sub').textContent='Choose a new password.'});
$('#s3').addEventListener('submit',e=>{e.preventDefault();const f=e.target;let ok=true;
 ok=setErr(f.np,!V.pass(f.np.value)?'Use at least 8 characters with uppercase, lowercase and a number.':'')&&ok;
 ok=setErr(f.cp,f.cp.value!==f.np.value?'Passwords do not match.':'')&&ok;if(!ok)return;
 AT.DB.updateCustomer(cust.id,{pass:AT.hash(f.np.value)});UI.toast('Password updated. Please log in.','ok');setTimeout(()=>location.href='login.html',900)});
</script></body></html>
