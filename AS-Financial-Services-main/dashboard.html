<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Dashboard – AS Financial Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="at-assets/css/style.css"></head>
<body data-base="">
<div id="site-header"></div>
<div class="dash">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
</div>
<script src="at-assets/js/store.js"></script><script src="at-assets/js/ui.js"></script><script src="at-assets/js/pages.js"></script>
<script>
UI.mount('');
if(UI.Guard.customer()){
const {$,$$,esc,icon,inr,fmtDate,fmtTen,fmtAmt,setErr,V,toast}=UI;
const NAV=[['overview','layout','Overview'],['applications','file','My Applications'],['saved','heart','Saved Lenders'],['partners','building','Bank Partners'],['eligibility','percent','Eligibility'],['enquiries','msg','My Enquiries'],['documents','upload','Documents'],['notifications','bell','Notifications'],['profile','user','Profile'],['support','phone','Support']];
let tab=(location.hash||'#overview').slice(1);if(!NAV.some(n=>n[0]===tab))tab='overview';
const me=()=>AT.Auth.customer();
const loanName=id=>{const l=AT.DB.loans().find(x=>x.id===id);return l?l.name:id};
const myApps=()=>AT.DB.apps().filter(a=>a.customerId===me().id);
const badge=s=>'<span class="badge '+AT.DB.STATUS_CLASS[s]+'">'+s+'</span>';
const demo='<div class="demo-note" style="margin-bottom:22px">Demo dashboard — all data is simulated and stored only in your browser.</div>';
const BANK_PARTNERS=[
 ['SBI','Public sector bank'],['HDFC Bank','Private bank'],['ICICI Bank','Private bank'],['Axis Bank','Private bank'],['Kotak Mahindra Bank','Private bank'],
 ['Bank of Baroda','Public sector bank'],['Canara Bank','Public sector bank'],['Union Bank of India','Public sector bank'],['Punjab National Bank','Public sector bank'],['Indian Bank','Public sector bank'],
 ['IDFC FIRST Bank','Private bank'],['Yes Bank','Private bank'],['Federal Bank','Private bank'],['IndusInd Bank','Private bank'],['Bandhan Bank','Private bank'],
 ['UCO Bank','Public sector bank'],['Central Bank of India','Public sector bank'],['Indian Overseas Bank','Public sector bank'],['Bank of India','Public sector bank'],['IDBI Bank','Private bank'],
 ['Bajaj Finserv','NBFC / HFC'],['Tata Capital','NBFC / HFC'],['HDB Financial Services','NBFC / HFC'],['L&T Finance','NBFC / HFC'],['Muthoot Finance','NBFC / HFC'],
 ['Shriram Finance','NBFC / HFC'],['Cholamandalam','NBFC / HFC'],['Edelweiss','NBFC / HFC'],['IIFL Finance','NBFC / HFC'],['Sundaram Finance','NBFC / HFC'],
 ['Mahindra Finance','NBFC / HFC'],['Hero FinCorp','NBFC / HFC'],['Shriram City','NBFC / HFC'],['CreditAccess Grameen','NBFC / HFC'],['Tata Motors Finance','NBFC / HFC'],
 ['LIC Housing Finance','NBFC / HFC'],['Reliance Home Finance','NBFC / HFC']
];
function side(){const c=me();const un=c.notifications.filter(n=>!n.read).length;
 $('#side').innerHTML='<div style="padding:6px 12px 12px;display:flex;gap:12px;align-items:center"><div class="avatar" style="background:var(--gold);color:var(--navy)">'+UI.initials(c.name)+'</div><div><b style="color:#fff;font-size:.95rem">'+esc(c.name)+'</b><div style="font-size:.72rem;color:#7F93B5">CUSTOMER</div></div></div><h5>Menu</h5>'+
 NAV.map(n=>'<button data-t="'+n[0]+'" class="'+(n[0]===tab?'on':'')+'">'+icon(n[1])+' '+n[2]+(n[0]==='notifications'&&un?'<span class="cnt">'+un+'</span>':'')+'</button>').join('')+
 '<h5>Quick links</h5><button data-go="apply.html">'+icon('plus')+' Apply for a Loan</button><button data-go="compare.html">'+icon('chart')+' Compare Lenders</button><button data-go="emi-calculator.html">'+icon('calc')+' EMI Calculator</button><button data-logout>'+icon('logout')+' Logout</button>';
 $$('[data-t]',$('#side')).forEach(b=>b.onclick=()=>{tab=b.dataset.t;history.replaceState(null,'','#'+tab);render()});
 $$('[data-go]',$('#side')).forEach(b=>b.onclick=()=>location.href=b.dataset.go);
 $('[data-logout]',$('#side')).onclick=()=>{AT.Auth.logoutCustomer();toast('You have been logged out.');setTimeout(()=>location.href='login.html',500)};}
const head=(t,s)=>'<div class="main-head"><div><h1>'+t+'</h1><p>'+s+'</p></div></div>'+demo;
const V_={
overview(){const c=me(),a=myApps();const cnt=s=>a.filter(x=>x.status===s).length;
 return '<div class="main-head"><div><h1>Welcome back, '+esc(c.name.split(' ')[0])+' 👋</h1><p>Here is a summary of your loan journey.</p></div><a class="btn btn-gold" href="apply.html">'+icon('plus')+' New Application</a></div>'+demo+
 '<div class="status-cards">'+AT.DB.STATUS.map((s,i)=>'<div class="sc s'+(i+1)+'"><b>'+cnt(s)+'</b><span>'+s+'</span></div>').join('')+'</div>'+
 '<div class="grid" style="grid-template-columns:1.4fr 1fr;gap:24px;margin-top:28px" id="ovg"><div class="card"><div class="row-between" style="margin-bottom:12px"><h3>Recent applications</h3><button class="btn btn-ghost btn-sm" data-t="applications">View all</button></div>'+
 (a.length?a.slice(0,3).map(x=>'<div class="row-between" style="padding:12px 0;border-bottom:1px solid var(--line)"><div><b style="color:var(--navy)">'+esc(loanName(x.type))+'</b><div style="font-size:.8rem;color:var(--muted)">'+esc(x.ref)+' • '+inr(x.amount)+'</div></div>'+badge(x.status)+'</div>').join(''):'<p style="color:var(--muted)">No applications yet. <a class="link" href="apply.html">Start one</a>.</p>')+'</div>'+
 '<div class="card"><h3 style="margin-bottom:12px">Profile</h3><dl class="kv" style="grid-template-columns:90px 1fr"><dt>Name</dt><dd>'+esc(c.name)+'</dd><dt>Email</dt><dd>'+esc(c.email)+'</dd><dt>Mobile</dt><dd>'+esc(c.mobile)+'</dd><dt>City</dt><dd>'+esc(c.city||'—')+'</dd><dt>Member since</dt><dd>'+fmtDate(c.created)+'</dd></dl><button class="btn btn-outline btn-sm" style="margin-top:14px" data-t="profile">Edit profile</button></div></div>'+
 '<div class="grid g3" style="margin-top:24px"><div class="card stat"><div class="ic" style="background:#FFF1D6;color:#9a6200">'+icon('heart')+'</div><div><b>'+c.saved.length+'</b><span>Saved lenders</span></div></div><div class="card stat"><div class="ic" style="background:#E4EEFF;color:#1f4fb0">'+icon('bell')+'</div><div><b>'+c.notifications.filter(n=>!n.read).length+'</b><span>Unread notifications</span></div></div><div class="card stat"><div class="ic" style="background:#D9F4E6;color:#146c43">'+icon('file')+'</div><div><b>'+Object.values(c.docs||{}).filter(Boolean).length+'/3</b><span>Documents uploaded</span></div></div></div>'},
applications(){const a=myApps();
 return head('My Applications','Track the live status of each application.')+(a.length?a.map(x=>{const idx=Math.max(0,['Application Submitted','Under Review','Documents Required','Approved'].indexOf(x.status));const rej=x.status==='Rejected';
  return '<div class="card" style="margin-bottom:18px"><div class="row-between"><div><h3>'+esc(loanName(x.type))+'</h3><div style="color:var(--muted);font-size:.86rem">Ref <b>'+esc(x.ref)+'</b> • '+inr(x.amount)+' • '+fmtTen(x.tenure)+' • Applied '+fmtDate(x.created)+'</div></div>'+badge(x.status)+'</div>'+
  '<div class="progress">'+[0,1,2,3].map(i=>'<i class="'+(rej?'':(i<=idx?'f':''))+'" '+(rej?'style="background:var(--bad)"':'')+'></i>').join('')+'</div>'+
  (x.status==='Documents Required'?'<div class="demo-note" style="margin-bottom:12px;background:#FDE7D3;border-color:#E8782E;color:#8a3d00">Action needed: '+esc(x.docsRequested||'Additional documents requested.')+' <a class="link" href="#documents" data-t="documents">Upload documents</a></div>':'')+
  '<details><summary style="cursor:pointer;font-weight:600;color:var(--navy);margin-bottom:10px">Status history</summary><ul class="timeline">'+x.history.slice().reverse().map(h=>'<li><b>'+esc(h.status)+'</b> <span style="color:var(--muted)">· '+fmtDate(h.date)+'</span><div style="font-size:.84rem;color:var(--muted)">'+esc(h.note||'')+'</div></li>').join('')+'</ul></details></div>'}).join(''):'<div class="card" style="text-align:center;padding:50px"><h3>No applications yet</h3><p style="color:var(--muted);margin:10px 0 20px">Start your first loan application in five easy steps.</p><a class="btn btn-gold" href="apply.html">Apply Now</a></div>')},
saved(){const c=me();const ls=AT.DB.lenders().filter(l=>c.saved.includes(l.id));
 return head('Saved Lenders','Your preferred loan options from the comparison page.')+(ls.length?'<div class="grid g3">'+ls.map(l=>'<div class="card"><div class="lender"><div class="lg" style="background:'+l.color+'">'+esc(l.name[0])+'</div><h3 style="font-size:1.1rem">'+esc(l.name)+'</h3></div><dl class="kv" style="grid-template-columns:90px 1fr;margin:14px 0"><dt>Rate</dt><dd>'+l.rate+'% – '+l.rateMax+'%</dd><dt>Amount</dt><dd>₹'+fmtAmt(l.minAmt)+' – ₹'+fmtAmt(l.maxAmt)+'</dd><dt>Fee</dt><dd>'+l.fee+'%</dd><dt>Status</dt><dd>'+(l.enabled?'Listed':'Currently unlisted')+'</dd></dl><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-gold btn-sm" data-el="'+l.id+'">Check Eligibility</button><button class="btn btn-outline btn-sm" data-rm="'+l.id+'">Remove</button></div></div>').join('')+'</div>':'<div class="card" style="text-align:center;padding:50px"><h3>No saved lenders</h3><p style="color:var(--muted);margin:10px 0 20px">Tap the heart on any lender in the comparison table.</p><a class="btn btn-gold" href="compare.html">Compare Lenders</a></div>')},
partners(){return head('Bank & NBFC Partners','The partner institutions listed on our public website.')+'<div class="grid g3">'+BANK_PARTNERS.map(p=>'<div class="card"><h3 style="font-size:1rem;margin-bottom:6px">'+esc(p[0])+'</h3><span style="font-size:.82rem;color:var(--muted)">'+esc(p[1])+'</span></div>').join('')+'</div><p style="margin-top:16px;font-size:.84rem;color:var(--muted)">Availability depends on loan type, customer profile and each lender’s policy. Listing does not guarantee an offer or approval.</p>'},
eligibility(){return head('Loan Eligibility','Indicative eligibility across lender listings (50% income-to-EMI rule).')+'<div class="card"><div class="form-grid"><div><label class="lbl">Monthly income (₹)</label><input class="input" id="e-inc" type="number" min="0" placeholder="60000"></div><div><label class="lbl">Existing EMIs (₹)</label><input class="input" id="e-emi" type="number" min="0" value="0"></div><div><label class="lbl">Loan type</label><select class="input" id="e-type"><option value="">All</option>'+AT.DB.loans().map(l=>'<option value="'+l.id+'">'+esc(l.name)+'</option>').join('')+'</select></div><div style="align-self:end"><button class="btn btn-gold btn-block" id="e-go">Check Eligibility</button></div></div></div><div id="e-out" style="margin-top:22px"></div>'},
enquiries(){const c=me();const l=AT.DB.enq().filter(e=>e.customerId===c.id||e.email.toLowerCase()===c.email.toLowerCase());
 return head('My Enquiries','Messages you have sent to our team.')+(l.length?'<div class="table-wrap"><table class="tbl"><tr><th>Date</th><th>Message</th><th>Status</th></tr>'+l.map(e=>'<tr><td style="white-space:nowrap">'+fmtDate(e.date)+'</td><td>'+esc(e.message)+'</td><td><span class="badge '+(e.status==='Resolved'?'b-res':'b-pend')+'">'+e.status+'</span></td></tr>').join('')+'</table></div>':'<div class="card" style="text-align:center;padding:40px"><p style="color:var(--muted)">No enquiries yet.</p><button class="btn btn-gold" style="margin-top:14px" data-t="support">Contact Support</button></div>')},
documents(){const c=me();const slot=(k,l)=>'<div class="doc-slot '+(c.docs[k]?'has':'')+'"><b style="color:var(--navy)">'+l+'</b><div style="font-size:.8rem;color:var(--muted);margin:4px 0 8px">PDF, JPG or PNG • max 2 MB • demo only</div><div>'+(c.docs[k]?'<div style="color:var(--ok);font-weight:600">'+icon('check')+' Uploaded</div>'+(PV[k]?'<img class="pv" src="'+PV[k]+'" alt="">':'')+'<div style="font-size:.85rem">'+esc(c.docs[k])+'</div>':'<div style="color:var(--muted);font-size:.9rem">Not uploaded</div>')+'</div><div style="margin-top:10px;display:flex;gap:8px;justify-content:center"><label class="btn btn-outline btn-sm" style="cursor:pointer">'+icon('upload')+' '+(c.docs[k]?'Replace':'Upload')+'<input type="file" data-k="'+k+'" accept=".pdf,.jpg,.jpeg,.png" hidden></label>'+(c.docs[k]?'<button class="btn btn-ghost btn-sm" data-del="'+k+'">Remove</button>':'')+'</div></div>';
 return head('Documents','Upload placeholders for your KYC and income documents.')+'<div class="grid g3">'+slot('identity','Identity proof')+slot('address','Address proof')+slot('income','Income proof')+'</div><p style="margin-top:16px;font-size:.84rem;color:var(--muted)">Files are not uploaded anywhere — only the file names are kept in your browser for this demo.</p>'},
notifications(){const n=me().notifications;
 return '<div class="main-head"><div><h1>Notifications</h1><p>Updates about your applications and account.</p></div>'+(n.some(x=>!x.read)?'<button class="btn btn-outline btn-sm" id="mark">Mark all as read</button>':'')+'</div>'+demo+'<div class="card" style="padding:0">'+(n.length?n.map(x=>'<div class="notif '+(x.read?'read':'unread')+'" data-n="'+x.id+'"><span class="dot"></span><div><div>'+esc(x.text)+'</div><small style="color:var(--muted)">'+fmtDate(x.date)+'</small></div></div>').join(''):'<p style="padding:30px;color:var(--muted)">You are all caught up.</p>')+'</div>'},
profile(){const c=me();return head('Profile','Manage your personal information and password.')+'<div class="grid g2"><div class="card"><h3 style="margin-bottom:16px">Personal details</h3><form id="pf" novalidate><div style="margin-bottom:14px"><label class="lbl">Full name</label><input class="input" name="name" value="'+esc(c.name)+'"></div><div style="margin-bottom:14px"><label class="lbl">Email (cannot be changed)</label><input class="input" value="'+esc(c.email)+'" disabled></div><div style="margin-bottom:14px"><label class="lbl">Mobile</label><input class="input" name="mobile" value="'+esc(c.mobile)+'" maxlength="10"></div><div style="margin-bottom:18px"><label class="lbl">City</label><input class="input" name="city" value="'+esc(c.city||'')+'"></div><button class="btn btn-gold" type="submit">Save Changes</button></form></div>'+
 '<div class="card"><h3 style="margin-bottom:16px">Change password</h3><form id="pw" novalidate><div style="margin-bottom:14px"><label class="lbl">Current password</label><div class="pw"><input class="input" name="cur" type="password"><button type="button"></button></div></div><div style="margin-bottom:14px"><label class="lbl">New password</label><div class="pw"><input class="input" name="np" type="password"><button type="button"></button></div></div><div style="margin-bottom:18px"><label class="lbl">Confirm new password</label><div class="pw"><input class="input" name="cp" type="password"><button type="button"></button></div></div><button class="btn btn-navy" type="submit">Update Password</button></form></div></div>'},
support(){return head('Support','We typically reply within one business day.')+'<div class="grid g2"><div class="card"><h3 style="margin-bottom:14px">Send us a message</h3><div id="sf"></div></div><div class="card"><h3 style="margin-bottom:14px">Other ways to reach us</h3>'+Pages.contactInfo()+'</div></div>'}
};
const PV={};
function wire(){
 $$('[data-t]',$('#main')).forEach(b=>b.onclick=e=>{e.preventDefault();tab=b.dataset.t;history.replaceState(null,'','#'+tab);render()});
 $$('[data-el]',$('#main')).forEach(b=>b.onclick=()=>Pages.eligibilityModal(AT.DB.lenders().find(l=>l.id===b.dataset.el)));
 $$('[data-rm]',$('#main')).forEach(b=>b.onclick=()=>{AT.DB.updateCustomer(me().id,{saved:me().saved.filter(x=>x!==b.dataset.rm)});toast('Removed from saved lenders.');render()});
 const g=$('#e-go');if(g)g.onclick=()=>{const inc=+$('#e-inc').value,ex=+$('#e-emi').value||0,t=$('#e-type').value;if(!(inc>0)){toast('Enter your monthly income.','err');return}
  const rows=AT.DB.lenders().filter(l=>l.enabled&&(!t||l.types.includes(t))).map(l=>{const ten=Math.min(l.maxTen,l.types.includes('home-loan')?240:60);const r=Pages.eligible(inc,ex,l.rate,ten);return{l,amt:Math.min(r.amount,l.maxAmt),ten}}).sort((a,b)=>b.amt-a.amt);
  $('#e-out').innerHTML='<div class="table-wrap"><table class="tbl"><tr><th>Lender</th><th>Rate</th><th>Tenure used</th><th>Indicative amount</th><th></th></tr>'+rows.map(r=>'<tr><td><b>'+esc(r.l.name)+'</b></td><td>'+r.l.rate+'%</td><td>'+fmtTen(r.ten)+'</td><td>'+(r.amt>=r.l.minAmt?'<b style="color:var(--ok)">'+inr(r.amt)+'</b>':'<span style="color:var(--muted)">Below minimum</span>')+'</td><td>'+(r.amt>=r.l.minAmt?'<a class="btn btn-outline btn-sm" href="apply.html?amount='+r.amt+'&lender='+r.l.id+'">Apply</a>':'')+'</td></tr>').join('')+'</table></div><p style="font-size:.82rem;color:var(--muted);margin-top:10px">Indicative, demo-only calculation. Not a lender decision.</p>'};
 $$('input[type=file]',$('#main')).forEach(i=>i.onchange=()=>{const f=i.files[0];if(!f)return;if(f.size>2*1024*1024){toast('File is larger than 2 MB.','err');return}if(!/\.(pdf|jpe?g|png)$/i.test(f.name)){toast('Unsupported file type.','err');return}
  PV[i.dataset.k]=/image/.test(f.type)?URL.createObjectURL(f):'';const c=me();AT.DB.updateCustomer(c.id,{docs:Object.assign({},c.docs,{[i.dataset.k]:f.name})});AT.DB.notify(c.id,'Document uploaded: '+f.name);toast('Document uploaded (demo).','ok');render()});
 $$('[data-del]',$('#main')).forEach(b=>b.onclick=()=>{const c=me();const d=Object.assign({},c.docs);delete d[b.dataset.del];AT.DB.updateCustomer(c.id,{docs:d});render()});
 const mk=$('#mark');if(mk)mk.onclick=()=>{const c=me();AT.DB.updateCustomer(c.id,{notifications:c.notifications.map(n=>Object.assign({},n,{read:true}))});render()};
 $$('[data-n]',$('#main')).forEach(n=>n.onclick=()=>{const c=me();AT.DB.updateCustomer(c.id,{notifications:c.notifications.map(x=>x.id===n.dataset.n?Object.assign({},x,{read:true}):x)});render()});
 const pf=$('#pf');if(pf)pf.onsubmit=e=>{e.preventDefault();let ok=true;ok=setErr(pf.elements.name,pf.elements.name.value.trim().length<2?'Enter your name.':'')&&ok;ok=setErr(pf.mobile,!V.mobile(pf.mobile.value.trim())?'Enter a valid 10-digit mobile.':'')&&ok;if(!ok)return;AT.DB.updateCustomer(me().id,{name:pf.elements.name.value.trim(),mobile:pf.mobile.value.trim(),city:pf.city.value.trim()});toast('Profile updated.','ok');render()};
 const pw=$('#pw');if(pw){UI.pwToggle($('#main'));pw.onsubmit=e=>{e.preventDefault();let ok=true;ok=setErr(pw.cur,me().pass!==AT.hash(pw.cur.value)?'Current password is incorrect.':'')&&ok;ok=setErr(pw.np,!V.pass(pw.np.value)?'Use 8+ characters with uppercase, lowercase and a number.':'')&&ok;ok=setErr(pw.cp,pw.cp.value!==pw.np.value?'Passwords do not match.':'')&&ok;if(!ok)return;AT.DB.updateCustomer(me().id,{pass:AT.hash(pw.np.value)});pw.reset();toast('Password updated.','ok')}}
 const sf=$('#sf');if(sf){sf.innerHTML=Pages.contactFormHtml();Pages.contactForm($('form',sf));$('form',sf).addEventListener('submit',()=>setTimeout(()=>{if(!$('[name=message]',sf).value)render()},50))}
 const ovg=$('#ovg');if(ovg&&innerWidth<900)ovg.style.gridTemplateColumns='1fr';
}
function render(){side();$('#main').innerHTML=V_[tab]();wire();}
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(NAV.some(n=>n[0]===t)){tab=t;render()}});
window.addEventListener('storage',render); // reflect admin changes made in another tab
render();
}
</script></body></html>
